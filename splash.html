<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="index.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--win-gray);
    }
    .splash-card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 4px;
    }
    .splash-content {
      flex: 1;
      background: linear-gradient(to bottom, #003333 0%, #004d4d 30%, #008080 65%, #00cccc 85%, #00e6e6 100%);
      border: 1.5px inset var(--bevel-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    /* Constellation background overlay */
    .constellation-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.55;
      pointer-events: none;
    }
    .logo-container {
      margin-top: 30px;
      z-index: 5;
    }
    .globe-logo {
      width: 76px;
      height: 76px;
      border: 2px solid #ffffff;
      background-color: #005a5b;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
    }
    .title-container {
      text-align: center;
      margin-top: 25px;
      z-index: 5;
      color: #ffffff;
      font-family: "Times New Roman", Times, Georgia, serif;
    }
    .brand-main {
      font-size: 28px;
      font-weight: bold;
      text-shadow: 2px 2px 2px #000000, -1px -1px 2px #000000;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .brand-sub {
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 2px #000000, -1px -1px 2px #000000;
      margin: 2px 0 0 0;
    }
    .gold-text {
      color: #ffd700;
      text-shadow: 2px 2px 2px #000000, 0 0 6px rgba(255, 215, 0, 0.6);
    }
    .splash-close {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 16px;
      height: 14px;
      background-color: var(--win-gray);
      border-top: 1.5px solid #fff;
      border-left: 1.5px solid #fff;
      border-bottom: 2px solid var(--bevel-dark);
      border-right: 2px solid var(--bevel-dark);
      color: #000;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
      z-index: 100;
    }
    .splash-close:active {
      border-top: 1.5px solid var(--bevel-shadow);
      border-left: 1.5px solid var(--bevel-shadow);
      border-bottom: 1.5px solid #fff;
      border-right: 1.5px solid #fff;
      padding: 1px 0 0 1px;
    }
    /* Semicircle Wheel positioning rising from footer bar */
    .wheel-container {
      position: absolute;
      bottom: 58px; /* rests right above the black footer */
      width: 100%;
      height: 140px;
      z-index: 2;
    }
    .splash-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 60px;
      width: 100%;
      background-color: #000000;
      border-top: 1px solid var(--bevel-shadow);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #a0a0a0;
      font-family: inherit;
      font-size: 9px;
      line-height: 1.4;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="splash-card bevel-outset-deep">
    <div class="splash-content">
      <div class="splash-close" id="btn-close" title="Close splash screen">&times;</div>
      
      <!-- Constellations lines and stars background -->
      <svg class="constellation-overlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450">
        <!-- Intersecting green constellation paths -->
        <line x1="20" y1="50" x2="180" y2="20" stroke="#00ff88" stroke-width="0.7" opacity="0.4" />
        <line x1="180" y1="20" x2="280" y2="120" stroke="#00ff88" stroke-width="0.7" opacity="0.4" />
        <line x1="180" y1="20" x2="120" y2="180" stroke="#00ff88" stroke-width="0.7" opacity="0.4" />
        <line x1="20" y1="50" x2="120" y2="180" stroke="#00ff88" stroke-width="0.7" opacity="0.4" />
        <line x1="120" y1="180" x2="250" y2="220" stroke="#00ff88" stroke-width="0.7" opacity="0.4" />
        <line x1="280" y1="120" x2="250" y2="220" stroke="#00ff88" stroke-width="0.7" opacity="0.4" />
        
        <!-- Stars stars dots -->
        <circle cx="20" cy="50" r="1.5" fill="#ffffff" />
        <circle cx="180" cy="20" r="2" fill="#ffffff" />
        <circle cx="280" cy="120" r="1.5" fill="#ffffff" />
        <circle cx="120" cy="180" r="2" fill="#ffffff" />
        <circle cx="250" cy="220" r="1.5" fill="#ffffff" />
        <circle cx="50" cy="110" r="1" fill="#ffffff" />
        <circle cx="220" cy="80" r="1" fill="#ffffff" />
        
        <!-- Shooting star -->
        <line x1="200" y1="100" x2="250" y2="150" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <line x1="220" y1="120" x2="250" y2="150" stroke="#00ff88" stroke-width="0.7" opacity="0.4" />
      </svg>

      <!-- Classic N Globe Logo Box -->
      <div class="logo-container">
        <svg class="globe-logo" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <!-- Teal space top area -->
          <rect width="40" height="40" fill="#005a5b" />
          <!-- Small stars inside logo -->
          <circle cx="8" cy="8" r="0.5" fill="#ffffff" />
          <circle cx="32" cy="12" r="0.5" fill="#ffffff" />
          <circle cx="12" cy="22" r="0.5" fill="#ffffff" />
          <!-- Black Earth Semicircle -->
          <path d="M4 36 A16 16 0 0 1 36 36 Z" fill="#000000" />
          <!-- White Serif Letter N -->
          <text x="20" y="32" font-family="'Times New Roman', Times, Georgia, serif" font-size="29" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
        </svg>
      </div>

      <!-- App Title Text -->
      <div class="title-container">
        <div class="brand-main">Notscape</div>
        <div class="brand-sub">Nostalgia <span class="gold-text">Gold</span></div>
      </div>

      <!-- Wooden Helmsman Ship Wheel Semicircle -->
      <div class="wheel-container">
        <svg viewBox="0 0 100 50" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Cyan backdrop radial glow filter -->
            <radialGradient id="wheel-glow" cx="50%" cy="100%" r="70%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
              <stop offset="40%" stop-color="#00ffff" stop-opacity="0.7" />
              <stop offset="70%" stop-color="#008080" stop-opacity="0.2" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Backlight glow circles -->
          <circle cx="50" cy="50" r="38" fill="url(#wheel-glow)" opacity="0.85" />

          <!-- Outer Wheel Rim (Brown wood styling) -->
          <circle cx="50" cy="50" r="32" fill="none" stroke="#683416" stroke-width="4.5" />
          <!-- Outer and Inner Gold Highlights lines -->
          <circle cx="50" cy="50" r="34" fill="none" stroke="#d4af37" stroke-width="0.75" />
          <circle cx="50" cy="50" r="29.7" fill="none" stroke="#d4af37" stroke-width="0.75" />

          <!-- Inner Rim Ring -->
          <circle cx="50" cy="50" r="23" fill="none" stroke="#683416" stroke-width="2.5" />
          <circle cx="50" cy="50" r="24.2" fill="none" stroke="#d4af37" stroke-width="0.5" />
          <circle cx="50" cy="50" r="21.8" fill="none" stroke="#d4af37" stroke-width="0.5" />
          
          <!-- Hub center half circle -->
          <circle cx="50" cy="50" r="8" fill="#683416" stroke="#d4af37" stroke-width="1"/>
          <circle cx="50" cy="50" r="3" fill="#d4af37"/>

          <!-- 5 spokes radiating outwards -->
          <!-- Vertical Up spoke (90 deg) -->
          <line x1="50" y1="50" x2="50" y2="8" stroke="#683416" stroke-width="3" />
          <line x1="50" y1="50" x2="50" y2="8" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="16, 20" />
          <circle cx="50" cy="8" r="2.2" fill="#d4af37" stroke="#683416" stroke-width="0.75" />
          
          <!-- Up-Left spoke (45 deg) -->
          <line x1="50" y1="50" x2="20.3" y2="20.3" stroke="#683416" stroke-width="3" />
          <line x1="50" y1="50" x2="20.3" y2="20.3" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="16, 20" />
          <circle cx="20.3" cy="20.3" r="2.2" fill="#d4af37" stroke="#683416" stroke-width="0.75" />
          
          <!-- Up-Right spoke (135 deg) -->
          <line x1="50" y1="50" x2="79.7" y2="20.3" stroke="#683416" stroke-width="3" />
          <line x1="50" y1="50" x2="79.7" y2="20.3" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="16, 20" />
          <circle cx="79.7" cy="20.3" r="2.2" fill="#d4af37" stroke="#683416" stroke-width="0.75" />
          
          <!-- Left spoke (180 deg) -->
          <line x1="50" y1="50" x2="8" y2="50" stroke="#683416" stroke-width="3" />
          <line x1="50" y1="50" x2="8" y2="50" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="16, 20" />
          <circle cx="8" cy="50" r="2.2" fill="#d4af37" stroke="#683416" stroke-width="0.75" />
          
          <!-- Right spoke (0 deg) -->
          <line x1="50" y1="50" x2="92" y2="50" stroke="#683416" stroke-width="3" />
          <line x1="50" y1="50" x2="92" y2="50" stroke="#d4af37" stroke-width="0.75" stroke-dasharray="16, 20" />
          <circle cx="92" cy="50" r="2.2" fill="#d4af37" stroke="#683416" stroke-width="0.75" />
        </svg>
      </div>

      <!-- Black Copyright Footer Area -->
      <div class="splash-footer">
        <div>Copyright &copy; 1996 Notscape Communications. All rights parodied.</div>
        <div style="margin-top: 2px; color: #808080;">Zero rights reserved. May cause intense 90s flashbacks.</div>
      </div>
    </div>
  </div>

  <script>
    const dismiss = () => {
      window.notscapeAPI.dismissSplash();
    };

    // Close on click anywhere or close button
    document.addEventListener('click', dismiss);
    document.getElementById('btn-close').addEventListener('click', (e) => {
      e.stopPropagation();
      dismiss();
    });

    // Close on any keypress
    document.addEventListener('keydown', dismiss);
  </script>
</body>
</html>
